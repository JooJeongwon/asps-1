<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#172c48" />
    <title>두근두근 코코네: 운명의 팀원을 선택하세요 — TEAM 01</title>
    <meta
      name="description"
      content="네 명을 모두 만나고, 마지막에 단 한 명을 선택하라. 단, 선택한 뒤에도 팀플에서는 탈출할 수 없다."
    />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta
      property="og:title"
      content="두근두근 코코네: 운명의 팀원을 선택하세요 — 연분 · TEAM 01"
    />
    <meta
      property="og:description"
      content="네 남자와 20번의 선택. 마지막엔 한 명을 고르지만, 팀플은 네 명과 함께."
    />
    <meta
      property="og:image"
      content="https://asps-1.vercel.app/assets/campus-cover.webp"
    />
    <link rel="preload" as="image" href="/assets/campus-cover.webp" />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/vendor/monogatari/monogatari.css" />
    <link rel="stylesheet" href="/play.css" />
    <link rel="stylesheet" href="/campus.css" />
    <script src="/vendor/monogatari/monogatari.js" defer></script>
    <script src="/characters.js" defer></script>
    <script src="/team.js" defer></script>
    <script src="/saju.js" defer></script>
    <script src="/scenario.js" defer></script>
    <script src="/story.js" defer></script>
    <script src="/game.js" defer></script>
  </head>
  <body class="campus-game">
    <main id="monogatari" aria-label="두근두근 코코네: 운명의 팀원을 선택하세요">
      <visual-novel>
        <loading-screen></loading-screen>
        <main-screen><main-menu></main-menu></main-screen>
        <game-screen>
          <div id="cover-art" aria-hidden="true">
            <img src="/assets/campus-cover.webp" alt="" fetchpriority="high" />
          </div>
          <div class="scene-heading" aria-live="polite">
            <div class="chapter">
              <span id="route-name">코코네 강의실 문 앞</span
              ><small id="route-motif">TEAM 01 · 두근두근 코코네</small>
            </div>
            <span id="route-location">코코네 강의실 · 프롤로그</span
            ><span id="route-step">만남 0 / 4</span>
          </div>
          <div
            id="affinity-hud"
            aria-label="네 사람과의 대화 진행"
            aria-live="polite"
          ></div>
          <div id="opening-title">
            <small>TEAM 01</small>
            <span class="cover-brand">C O C O N E</span>
            <h1>두근두근<br /><em>코코네</em></h1>
            <strong class="cover-subtitle">운명의 팀원을 선택하세요</strong>
            <p>
              네 명을 모두 만나고, 마지막에 단 한 명을 선택하라.<br />단, 선택한 뒤에도 팀플에서는 탈출할 수 없다.
            </p>
          </div>
          <dialog-log></dialog-log>
          <text-box></text-box>
          <quick-menu></quick-menu>
        </game-screen>
        <load-screen></load-screen>
        <save-screen></save-screen>
        <settings-screen></settings-screen>
        <help-screen></help-screen>
      </visual-novel>
    </main>
    <p id="engine-status" class="engine-status" role="status">
      이야기를 준비하고 있어요…
    </p>
    <noscript>플레이하려면 브라우저에서 JavaScript를 켜주세요.</noscript>
  </body>
</html>
