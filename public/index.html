<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f4f9" />
    <title>오늘, 우리 중 한 명을 선택해 — TEAM 01</title>
    <meta
      name="description"
      content="정치훈, 박진환, 주정원, 남성수. 하루 동안 네 사람을 알아가고 마지막 밤, 당신이 직접 한 명을 선택하는 이야기."
    />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/vendor/monogatari/monogatari.css" />
    <link rel="stylesheet" href="/play.css" />
    <script src="/vendor/monogatari/monogatari.js" defer></script>
    <script src="/characters.js" defer></script>
    <script src="/team.js" defer></script>
    <script src="/saju.js" defer></script>
    <script src="/scenario.js" defer></script>
    <script src="/story.js" defer></script>
    <script src="/game.js" defer></script>
  </head>
  <body>
    <main id="monogatari" aria-label="오늘, 우리 중 한 명을 선택해">
      <visual-novel>
        <loading-screen></loading-screen>
        <main-screen><main-menu></main-menu></main-screen>
        <game-screen>
          <div class="scene-heading" aria-live="polite">
            <div class="chapter">
              <span id="route-name">새로운 시작</span
              ><small id="route-motif">TEAM 01 · 네 사람을 알아가는 하루</small>
            </div>
            <span id="route-location">학교 건물 외부 · 아침</span
            ><span id="route-step">CUT 01 / 20</span>
          </div>
          <div
            id="affinity-hud"
            aria-label="네 사람의 호감도"
            aria-live="polite"
          ></div>
          <div id="opening-title">
            <small>TEAM 01</small>
            <h1>오늘, 우리 중<br />한 명을 선택해</h1>
            <p>첫 만남부터 마지막 선택까지, 함께 만드는 하루.</p>
          </div>
          <dialog-log></dialog-log>
          <text-box></text-box>
          <quick-menu></quick-menu>
        </game-screen>
        <load-screen></load-screen>
        <save-screen></save-screen>
        <settings-screen></settings-screen>
        <help-screen></help-screen>
      </visual-novel>
    </main>
    <p id="engine-status" class="engine-status" role="status">
      이야기를 준비하고 있어요…
    </p>
    <noscript>플레이하려면 브라우저에서 JavaScript를 켜주세요.</noscript>
  </body>
</html>
